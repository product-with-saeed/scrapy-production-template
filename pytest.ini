[pytest]
# Pytest Configuration for Scrapy Production Template
# Following PEP 8 and TDD best practices

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Command line options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Shorter traceback format
    --tb=short
    # Strict markers - fail on unknown markers
    --strict-markers
    # Strict config - fail on config issues
    --strict-config
    # Coverage options
    --cov=scrapers
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage is below 85% (target: 95%)
    # Current target: Comprehensive coverage of all modules
    --cov-fail-under=85
    # Show warnings
    -W default

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (may use database, external services)
    slow: Slow tests (may take several seconds)
    spider: Spider-related tests
    pipeline: Pipeline-related tests
    middleware: Middleware-related tests
    database: Tests requiring database connection

# Coverage configuration
[coverage:run]
source = scrapers
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*
    */.eggs/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
