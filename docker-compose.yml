version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: scrapy_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrapy_db}
      POSTGRES_USER: ${POSTGRES_USER:-scrapy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrapy}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scrapy_network

  scraper:
    build: .
    container_name: scrapy_scraper
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-scrapy_db}
      POSTGRES_USER: ${POSTGRES_USER:-scrapy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrapy}
      POSTGRES_PORT: 5432
    volumes:
      - ./scrapers:/app/scrapers
      - ./data:/app/data
    networks:
      - scrapy_network
    command: tail -f /dev/null

volumes:
  postgres_data:

networks:
  scrapy_network:
    driver: bridge
